# Copy to rimkahan888/rimkahan888 as .github/workflows/snake.yml
# Then: Actions → generate contribution snake → Run workflow
# The README snake image 404s until this has run once.

name: generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

# Shares the output branch with the stats-card workflow. Do not publish
# over files that workflow already committed.
concurrency:
  group: profile-readme-output
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#F7B32B
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#F7B32B
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep stats cards already on the output branch
        uses: actions/checkout@v4
        with:
          ref: output
          path: output-prev
          fetch-depth: 1

      - name: Copy existing output files other than the snake
        run: |
          set -eu
          find output-prev -type f -not -path 'output-prev/.git/*' -print0 |
            while IFS= read -r -d '' file; do
              rel=${file#output-prev/}
              case "$rel" in
                github-contribution-grid-snake.svg|github-contribution-grid-snake-dark.svg)
                  continue
                  ;;
              esac
              mkdir -p "dist/$(dirname "$rel")"
              cp "$file" "dist/$rel"
            done

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
